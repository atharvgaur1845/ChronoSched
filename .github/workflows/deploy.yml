# Deploys ChronoSched to GitHub Pages.
#
# There is no build step — the repository IS the site. The workflow verifies the
# code first and only publishes if those checks pass, so a broken import can
# never reach the live URL.
#
# One-time setup: Settings → Pages → Source → "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one
# rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install: the app has none, and the two vendored
      # libraries are committed. `npm ci` would fail on a missing lockfile.
      - name: Check module integrity and layering
        run: node tools/verify-modules.mjs

      - name: Exercise the scheduling engine
        run: node tools/scheduler-smoke-test.mjs

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `enablement: true` turns Pages on via the API if it has never been
      # enabled, instead of failing with "Get Pages site failed / Not Found".
      # Without it the very first run of this workflow on a fresh repository
      # always errors until someone visits Settings → Pages by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The whole repository is uploaded. Everything the app needs at runtime —
      # index.html, css/, js/, data/, vendor/ — is tracked, so there is nothing
      # to compile or copy.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
